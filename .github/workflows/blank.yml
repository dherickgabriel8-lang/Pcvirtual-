pc-virtual-web/
├── docker-
    
services:
  pc:
    build: .
    privileged: true
    restart: unless-stopped
    environment:
      DISPLAY: ":0"
    volumes:
      - ./data:/data
    ports:
      - "6080:6080"
      - "5900:5900"

  web:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - pc
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web:/usr/share/nginx/html:ro
      services:
      FROM ubuntu:24.04

ENV DEBIAN_FRONTEND=noninteractive

RUN apt-get update && apt-get install -y \
    qemu-system-x86 \
    qemu-utils \
    novnc \
    websockify \
    xvfb \
    x11vnc \
    fluxbox \
    wget \
    curl \
    ca-certificates \
    && rm -rf /var/lib/apt/lists/*

RUN mkdir -p /data

COPY start-vm.sh /start-vm.sh
RUN chmod +x /start-vm.sh

EXPOSE 5900 6080

CMD ["/start-vm.sh"]
